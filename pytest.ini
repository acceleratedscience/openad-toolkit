[pytest]
# Pytest configuration for OpenAD toolkit

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options (minimal - plugins are optional)
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Show durations of slowest tests
    --durations=10
    # Strict markers
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    serialization: Serialization module tests
    molecule: Molecule-related tests
    workspace: Workspace-related tests
    toolkit: Toolkit-related tests
    security: Security-related tests
    performance: Performance tests
    smoke: Smoke tests for quick validation

# Coverage options (requires pytest-cov plugin)
# To enable coverage, run: pytest --cov=openad --cov-report=html:test_reports/coverage
[coverage:run]
source = openad
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Minimum coverage threshold
fail_under = 70

