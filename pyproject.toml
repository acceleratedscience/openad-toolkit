[project]
name = "openad"
version = "0.9.0"
description = "Open Accelerated Discovery"
authors = [
    {name = "Phil Downey", email = "phil.downey1@ibm.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
keywords = ["deepsearch", "rxn", "jupyter", "magic commands", "accelerated Discovery", "science", "retrosynthesis"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies
    "orjson==3.10.3",
    "msgpack>=1.0.8",
    "setuptools>=75.8.0",
    "blessed>=1.20.0",
    "flask>=3.1.0",
    "flask-bootstrap==3.3.7.1",
    "geckodriver-autoinstaller==0.1.0",
    "halo>=0.0.31",
    "ipython>=8.29.0",
    "ipywidgets>=8.1.5",
    "npm>=0.1.1",
    "nodejs>=0.1.1",
    "numpy>=1.26.2,<2.0",
    "pandas>=2.2.0",
    "pubchempy==1.0.4",
    "py3dmol>=2.0.4",
    "pyparsing>=3.1.0",
    "pyjwt>=2.10.0",
    "rdkit>=2024.3.0",
    "tqdm>=4.67.0",
    "tabulate>=0.9.0",
    "tiktoken>=0.8.0",
    "faiss-cpu>=1.9.0",
    "coverage>=7.6.0",
    "langchain>=0.3.15",
    "langchain-community>=0.3.1",
    "langchain-core>=0.3.0",
    "langsmith>=0.2.0",
    "langchain-text-splitters>=0.3.5",
    "langchain-ollama>=0.2.0",
    "ipykernel>=6.29.0",
    "pyperclip>=1.9.0",
    "jupyter-client>=8.6.0",
    "jupyter-core>=5.7.0",
    "jupyter-server>=2.14.0",
    "jupyterlab-server>=2.27.0",
    "jupyterlab>=4.3.0",
    "jupyterlab-widgets>=3.0.0",
    "widgetsnbextension>=4.0.0",
    "nbclient>=0.10.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
    "notebook>=7.3.0",
    "servicing>=0.0.12",
    "skypilot[aws,kubernetes]>=0.6.0",
    "filelock>=3.16.0",
    "tomlkit>=0.13.0",
    "flask-cors>=5.0.0",
    "websockets>=14.0",
    "asyncio>=3.4.3",
    "ijson>=3.3.0",
    "biopython>=1.84",
    "gemmi>=0.6.6",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "black>=24.10.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-dependency>=0.6.0",
    "pytest-asyncio>=0.24.0",
]
typing = [
    "mypy>=1.13.0",
]

[project.scripts]
openad = "openad.app.main:cmd_line"
init_magic = "openad.app.init_magic:init_magic"
init_examples = "openad.app.openad_examples:openad_create_examps"

[project.urls]
Homepage = "https://openad.accelerate.science"
Documentation = "https://openad.accelerate.science/docs"
Repository = "https://github.com/acceleratedscience/openad-toolkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120

[tool.mypy]
files = "tests"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
fix = true
line-length = 120
src = ["openad"]
target-version = "py310"
show-fixes = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E722", # Do not use bare `except`
    "F401", # imported but unused
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["openad"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
